name: pipit
description: >-
  Pipit, a hand-drawn bird widget that breathes, blinks, follows the pointer and
  changes pose on a spring. Drawn on a canvas, with no assets or dependencies.
version: 0.2.0
repository: https://github.com/Vurarddo/pipit/tree/main/packages/pipit
issue_tracker: https://github.com/Vurarddo/pipit/issues
topics:
  - widget
  - animation
  - mascot
  - canvas
screenshots:
  - description: Pipit in every pose and accessory, on light and dark.
    path: doc/pipit.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
